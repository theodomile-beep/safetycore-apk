name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Docker
        run: |
          docker run --rm \
            -v "$(pwd):/app" \
            -w /app \
            --entrypoint /bin/bash \
            kivy/buildozer \
            -c "
              apt-get update && apt-get install -y wget unzip
              
              export ANDROID_HOME=/root/.buildozer/android/platform/android-sdk
              mkdir -p \$ANDROID_HOME
              
              wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
              unzip -q commandlinetools-linux-9477386_latest.zip
              mkdir -p \$ANDROID_HOME/cmdline-tools
              mv cmdline-tools \$ANDROID_HOME/cmdline-tools/latest
              
              export PATH=\$ANDROID_HOME/cmdline-tools/latest/bin:\$PATH
              
              yes | sdkmanager --licenses 2>/dev/null || true
              sdkmanager 'build-tools;30.0.3' 2>/dev/null || true
              
              mkdir -p \$ANDROID_HOME/tools/bin
              ln -sf \$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \$ANDROID_HOME/tools/bin/sdkmanager
              
              mkdir -p /root/.buildozer/android/platform
              ln -sf \$ANDROID_HOME /root/.buildozer/android/platform/android-sdk
              
              buildozer android debug
            "

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: bin/*.apk
          overwrite: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          overwrite: true
