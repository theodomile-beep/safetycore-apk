name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip openjdk-17-jdk git zip unzip wget autoconf automake libtool
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Setup Android SDK
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR"
          ln -sf /usr/local/lib/android/sdk "$SDK_DIR"
          
          SDKMANAGER_PATH=$(find /usr/local/lib/android/sdk -name sdkmanager -type f 2>/dev/null | head -1)
          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$SDKMANAGER_PATH" "$SDK_DIR/tools/bin/sdkmanager"
          
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses 2>/dev/null || true
          yes | sdkmanager "build-tools;30.0.3" 2>/dev/null || true

      - name: Build APK with full output
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show gradlew error details
        if: always()
        run: |
          echo "===== SEARCHING FOR GRADLE ERROR ====="
          grep -A 20 -B 5 "gradlew failed" build.log || echo "No gradlew error found"
          echo "========================================"
          echo "===== SEARCHING FOR JAVA ERRORS ====="
          grep -E "javac|compiler|gradle|FAILED|error" build.log | head -30
          echo "========================================"
          echo "===== LAST 100 LINES ====="
          tail -100 build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
