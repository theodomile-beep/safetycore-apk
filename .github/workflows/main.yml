name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Symlink SDK and fix sdkmanager path
        run: |
          mkdir -p ~/.buildozer/android/platform
          rm -rf ~/.buildozer/android/platform/android-sdk
          ln -s /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk

          SDK_DIR=/usr/local/lib/android/sdk
          SDKMANAGER_PATH=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf "$SDKMANAGER_PATH" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          fi

      - name: Verify setup
        run: |
          ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --version || echo "sdkmanager ok"
          aidl --version || echo "aidl ok"

      - name: Build APK with full log capture
        id: build
        run: |
          echo "⚙️ Build started at $(date)"
          buildozer -v android debug 2>&1 | tee build.log
          echo "✅ Build finished at $(date)"

      - name: Find APK files
        if: always()
        run: |
          echo "Searching for APK files in entire workspace:"
          find . -name "*.apk" -type f -exec ls -lh {} \;
          # Store the path in an environment variable if found
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "APK_FOUND=$APK_PATH" >> $GITHUB_ENV
            echo "APK found at: $APK_PATH"
          else
            echo "No APK found."
          fi

      - name: Show error if build failed
        if: failure()
        run: |
          echo "❌ Build failed. Showing last 200 lines of build.log:"
          tail -n 200 build.log

      - name: Upload APK
        if: success() && env.APK_FOUND != ''
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: ${{ env.APK_FOUND }}

      - name: Fallback upload (if APK found in bin/)
        if: success() && hashFiles('bin/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK-fallback
          path: bin/*.apk
