name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix apt sources
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update

      - name: Install system dependencies
        run: |
          sudo apt-get install -y python3-pip autoconf automake libtool
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Symlink pre-installed SDK
        run: |
          mkdir -p ~/.buildozer/android/platform
          rm -rf ~/.buildozer/android/platform/android-sdk
          ln -s /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk

          SDK_DIR=/usr/local/lib/android/sdk
          SDKMANAGER_PATH=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf "$SDKMANAGER_PATH" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          fi

      - name: Clean Buildozer cache (FORCE FRESH BUILD)
        run: |
          rm -rf ~/.buildozer/cache
          rm -rf .buildozer
          rm -f build.log

      - name: Verify buildozer.spec contents
        run: |
          echo "=== buildozer.spec contents ==="
          cat buildozer.spec
          echo "==============================="

      - name: Build APK
        run: |
          echo "⚙️ Build started at $(date)"
          buildozer -v android debug --bootstrap sdl2 2>&1 | tee build.log
          echo "✅ Build finished at $(date)"

      - name: Print first 10 errors
        if: always()
        run: |
          echo "===== FIRST 10 ERRORS ====="
          grep -E "ERROR:|Exception:|failed:|Traceback" build.log | head -n 10 || echo "No errors found."
          echo "==========================="

      - name: Search for APK
        if: always()
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "APK_FOUND=$APK_PATH" >> $GITHUB_ENV
            echo "APK found at: $APK_PATH"
          else
            echo "No APK found."
          fi

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          overwrite: true

      - name: Upload APK
        if: success() && env.APK_FOUND != ''
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: ${{ env.APK_FOUND }}
          overwrite: true
