name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip openjdk-17-jdk git zip unzip wget
          pip install buildozer cython

      - name: NUKE EVERYTHING
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin
          rm -f build.log

      - name: Symlink SDK with correct sdkmanager path
        run: |
          mkdir -p ~/.buildozer/android/platform
          ln -sf /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk

          SDK_DIR=/usr/local/lib/android/sdk
          SDKMANAGER_PATH=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "Found sdkmanager at: $SDKMANAGER_PATH"

          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf "$SDKMANAGER_PATH" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          fi

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      - name: SHOW ERRORS ONLY
        if: always()
        run: |
          echo "========================================="
          echo "🔴 ERRORS FOUND IN BUILD:"
          echo "========================================="
          grep -E "ERROR:|Exception:|failed:|Traceback|Error\b" build.log | head -n 30
          echo "========================================="
          echo "✅ If nothing shows above, no errors found."
          echo "========================================="

      - name: Find APK
        if: always()
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "APK_FOUND=$APK_PATH" >> $GITHUB_ENV
          fi

      - name: Upload APK
        if: success() && env.APK_FOUND != ''
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: ${{ env.APK_FOUND }}
          overwrite: true

      - name: Upload build log (if you need it)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          overwrite: true
