name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest   # ← faster
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y openjdk-11-jdk python3-pip git zip unzip wget && pip install buildozer==1.5.0 cython==0.29.37
      - name: Build APK (verbose)
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: bin/*.apk
