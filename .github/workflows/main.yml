name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python and system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip autoconf automake libtool
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Symlink SDK and fix sdkmanager path
        run: |
          mkdir -p ~/.buildozer/android/platform
          rm -rf ~/.buildozer/android/platform/android-sdk
          ln -s /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk

          SDK_DIR=/usr/local/lib/android/sdk
          SDKMANAGER_PATH=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf "$SDKMANAGER_PATH" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          fi

      - name: Build APK and save log
        run: |
          echo "⚙️ Build started at $(date)"
          buildozer -v android debug 2>&1 | tee build.log
          echo "✅ Build finished at $(date)"

      - name: 🔍 Extract APK generation line
        if: always()
        run: |
          echo "===== APK GENERATION LINES ====="
          grep -i "apk" build.log | grep -i "generated\|creating\|package" || echo "No APK generation lines found."
          echo "================================="

      - name: 📄 Print last 30 lines (shows final status)
        if: always()
        run: |
          echo "===== LAST 30 LINES OF LOG ====="
          tail -n 30 build.log
          echo "================================="

      - name: 📁 List all APK files (anywhere)
        if: always()
        run: |
          echo "===== SEARCHING FOR APK FILES ====="
          find . -name "*.apk" -type f -exec ls -lh {} \; || echo "No APK found."
          echo "================================="

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
