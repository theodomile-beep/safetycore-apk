name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Docker
        run: |
          docker run --rm \
            -v "$(pwd):/app" \
            -w /app \
            --entrypoint /bin/bash \
            kivy/buildozer \
            -c "
              # Install SDK tools
              wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
              unzip -q commandlinetools-linux-9477386_latest.zip
              mkdir -p /root/.buildozer/android/platform/android-sdk/cmdline-tools
              mv cmdline-tools /root/.buildozer/android/platform/android-sdk/cmdline-tools/latest
              
              # Set PATH
              export PATH=/root/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:\$PATH
              
              # Accept licenses and install build-tools
              yes | sdkmanager --licenses
              sdkmanager 'build-tools;30.0.3'
              
              # Create symlink for sdkmanager
              mkdir -p /root/.buildozer/android/platform/android-sdk/tools/bin
              ln -sf /root/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager /root/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
              
              # Build APK
              buildozer android debug
            "

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
