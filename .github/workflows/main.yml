name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Docker (ULTIMATE FIX)
        run: |
          docker run --rm \
            -v "$(pwd):/app" \
            -w /app \
            --entrypoint /bin/bash \
            kivy/buildozer \
            -c "
              # Set ANDROID_HOME
              export ANDROID_HOME=/root/.buildozer/android/platform/android-sdk
              mkdir -p \$ANDROID_HOME
              
              # Download and install SDK tools
              wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
              unzip -q commandlinetools-linux-9477386_latest.zip
              mkdir -p \$ANDROID_HOME/cmdline-tools
              mv cmdline-tools \$ANDROID_HOME/cmdline-tools/latest
              
              # Add sdkmanager to PATH
              export PATH=\$ANDROID_HOME/cmdline-tools/latest/bin:\$PATH
              
              # Accept licenses
              yes | sdkmanager --licenses 2>/dev/null || true
              
              # Install build-tools
              sdkmanager 'build-tools;30.0.3' 2>/dev/null || true
              
              # CRITICAL: Create the EXACT symlink Buildozer expects
              mkdir -p \$ANDROID_HOME/tools/bin
              ln -sf \$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \$ANDROID_HOME/tools/bin/sdkmanager
              
              # Verify symlink exists
              echo "Checking symlink:"
              ls -la \$ANDROID_HOME/tools/bin/sdkmanager || echo \"Symlink not found!\"
              
              # Make sure Buildozer finds the SDK
              mkdir -p /root/.buildozer/android/platform
              ln -sf \$ANDROID_HOME /root/.buildozer/android/platform/android-sdk
              
              # Build APK
              buildozer android debug
            "

      - name: Find and upload APK
        if: success()
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" -type f -exec ls -lh {} \;
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "APK_FOUND=$APK_PATH" >> $GITHUB_ENV
            echo "APK found at: $APK_PATH"
          else
            echo "No APK found."
          fi

      - name: Upload APK
        if: success() && env.APK_FOUND != ''
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: ${{ env.APK_FOUND }}
          overwrite: true

      - name: Upload APK (fallback)
        if: success() && hashFiles('bin/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK-bin
          path: bin/*.apk
          overwrite: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          overwrite: true
