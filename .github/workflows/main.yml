name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            openjdk-11-jdk python3-pip wget unzip
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Setup Android SDK (with build-tools)
        uses: jborean93/setup-android-sdk@v3
        with:
          accept-licenses: true
          platforms: android-30
          build-tools: 30.0.3
          cmdline-tools-version: 9477386

      - name: Set environment for Buildozer
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/build-tools/30.0.3" >> $GITHUB_PATH

      - name: Build APK with full log capture
        id: build
        run: |
          echo "⚙️ Build started at $(date)"
          buildozer -v android debug 2>&1 | tee build.log
          echo "✅ Build finished at $(date)"

      - name: Show error if build failed
        if: failure()
        run: |
          echo "❌ Build failed. Showing last 100 lines of build.log:"
          tail -n 100 build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: bin/*.apk
