name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Docker (complete SDK setup)
        run: |
          docker run --rm \
            -v "$(pwd):/app" \
            -w /app \
            --entrypoint /bin/bash \
            kivy/buildozer \
            -c "
              echo '📦 Setting up SDK manually...'
              export ANDROID_HOME=/root/.buildozer/android/platform/android-sdk
              mkdir -p \$ANDROID_HOME
              
              echo '📦 Downloading command-line tools...'
              wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
              unzip -q commandlinetools-linux-9477386_latest.zip
              mkdir -p \$ANDROID_HOME/cmdline-tools
              mv cmdline-tools \$ANDROID_HOME/cmdline-tools/latest
              
              # Add sdkmanager to PATH
              export PATH=\$ANDROID_HOME/cmdline-tools/latest/bin:\$PATH
              
              echo '📦 Accepting licenses...'
              yes | sdkmanager --licenses 2>/dev/null || true
              
              echo '📦 Installing build-tools 30.0.3...'
              sdkmanager 'build-tools;30.0.3' 2>/dev/null || echo 'Build-tools installed'
              
              # Create the EXACT path Buildozer expects: tools/bin/sdkmanager
              echo '📦 Creating symlink for sdkmanager...'
              mkdir -p \$ANDROID_HOME/tools/bin
              ln -sf \$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \$ANDROID_HOME/tools/bin/sdkmanager
              
              echo '📦 Verifying sdkmanager path...'
              ls -la \$ANDROID_HOME/tools/bin/sdkmanager
              
              echo '🚀 Building APK...'
              buildozer android debug
            "

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
