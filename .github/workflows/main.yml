name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    
    steps:
      - name: 🚀 START BUILD - Step 1/12
        run: |
          echo "========================================="
          echo "🚀 STARTING APK BUILD PROCESS"
          echo "========================================="
          echo "Time: $(date)"
          echo "Runner: $(uname -a)"
          echo "========================================="

      - name: 📥 CHECKOUT CODE - Step 2/12
        uses: actions/checkout@v3
        run: |
          echo "✅ Code checked out successfully"
          echo "📁 Files in repository:"
          ls -la
          echo "========================================="

      - name: 🔧 INSTALL SYSTEM DEPENDENCIES - Step 3/12
        run: |
          echo "========================================="
          echo "🔧 Installing system dependencies..."
          echo "========================================="
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jdk python3-pip git zip unzip wget
          echo "✅ System dependencies installed"
          echo "Java version: $(java -version 2>&1 | head -n 1)"
          echo "Python version: $(python3 --version)"
          echo "========================================="

      - name: 📦 INSTALL PYTHON PACKAGES - Step 4/12
        run: |
          echo "========================================="
          echo "📦 Installing Python packages..."
          echo "========================================="
          pip install buildozer==1.5.0
          pip install cython==0.29.37
          echo "✅ Python packages installed"
          echo "Buildozer version: $(buildozer --version 2>&1 || echo 'unknown')"
          echo "========================================="

      - name: ⬇️ DOWNLOAD ANDROID SDK - Step 5/12
        run: |
          echo "========================================="
          echo "⬇️ Downloading Android SDK (this takes 3-5 minutes)..."
          echo "========================================="
          echo "📊 Progress will be shown below:"
          echo "-----------------------------------------"
          buildozer android debug 2>&1 | grep -E "(Downloading|Downloaded|Installing|Unpacking)" || echo "Downloading in progress..."
          echo "========================================="

      - name: ⚙️ BUILD PREPARATION - Step 6/12
        run: |
          echo "========================================="
          echo "⚙️ Preparing build environment..."
          echo "========================================="
          echo "Checking files:"
          ls -la
          echo "Checking main.py exists:"
          cat main.py | head -n 5 || echo "⚠️ main.py not found!"
          echo "Checking buildozer.spec exists:"
          cat buildozer.spec | head -n 5 || echo "⚠️ buildozer.spec not found!"
          echo "========================================="

      - name: 🐍 COMPILING PYTHON TO JAVA - Step 7/12
        run: |
          echo "========================================="
          echo "🐍 Compiling Python to Java (Cython)..."
          echo "========================================="
          echo "This takes 2-3 minutes..."
          echo "-----------------------------------------"
          buildozer android debug 2>&1 | grep -E "(Compiling|Cython|Building)" || echo "Compilation in progress..."
          echo "========================================="

      - name: 🎨 COMPILING RESOURCES - Step 8/12
        run: |
          echo "========================================="
          echo "🎨 Compiling Android resources..."
          echo "========================================="
          echo "Processing layouts, images, and assets..."
          echo "-----------------------------------------"
          buildozer android debug 2>&1 | grep -E "(Resource|AIDL|R.java)" || echo "Resource compilation in progress..."
          echo "========================================="

      - name: ☕ COMPILING JAVA - Step 9/12
        run: |
          echo "========================================="
          echo "☕ Compiling Java source code..."
          echo "========================================="
          echo "This takes 3-4 minutes..."
          echo "-----------------------------------------"
          buildozer android debug 2>&1 | grep -E "(javac|Compiling|dex)" || echo "Java compilation in progress..."
          echo "========================================="

      - name: 📦 PACKAGING APK - Step 10/12
        run: |
          echo "========================================="
          echo "📦 Packaging and signing APK..."
          echo "========================================="
          echo "Creating final APK file..."
          echo "-----------------------------------------"
          buildozer android debug 2>&1 | grep -E "(Packaging|Signing|Aligning|APK)" || echo "Packaging in progress..."
          echo "========================================="

      - name: ✅ APK GENERATION - Step 11/12
        run: |
          echo "========================================="
          echo "✅ APK GENERATION COMPLETE!"
          echo "========================================="
          echo "Finding APK files..."
          find . -name "*.apk" -type f 2>/dev/null
          APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "✅ APK created at: $APK_PATH"
            echo "📊 APK size: $(du -h "$APK_PATH" 2>/dev/null || echo 'unknown')"
            echo "-----------------------------------------"
            echo "📱 APK Details:"
            file "$APK_PATH" 2>/dev/null || echo "File details not available"
          else
            echo "❌ No APK found! Build may have failed."
            echo "Check logs above for errors."
          fi
          echo "========================================="

      - name: ⬆️ UPLOAD APK - Step 12/12
        uses: actions/upload-artifact@v3
        with:
          name: SafetyCore-APK
          path: bin/*.apk
        run: |
          echo "========================================="
          echo "⬆️ Uploading APK to artifacts..."
          echo "========================================="
          echo "✅ Build complete! APK ready to download"
          echo "📱 Download from Artifacts section below"
          echo "========================================="
          echo "🎉 BUILD SUCCESSFUL!"
          echo "Time completed: $(date)"
          echo "========================================="
