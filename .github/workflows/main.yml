name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip openjdk-17-jdk git zip unzip wget autoconf automake libtool
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Setup Android SDK with correct sdkmanager path
        run: |
          # Create Buildozer's expected SDK directory
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR"
          
          # Link pre-installed SDK to Buildozer's expected location
          ln -sf /usr/local/lib/android/sdk/* "$SDK_DIR/" 2>/dev/null || true
          ln -sf /usr/local/lib/android/sdk "$SDK_DIR"
          
          # Find actual sdkmanager location
          SDKMANAGER_PATH=$(find /usr/local/lib/android/sdk -name sdkmanager -type f 2>/dev/null | head -1)
          echo "Found sdkmanager at: $SDKMANAGER_PATH"
          
          # Create the exact path Buildozer expects: tools/bin/sdkmanager
          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$SDKMANAGER_PATH" "$SDK_DIR/tools/bin/sdkmanager"
          
          # Verify symlink
          ls -la "$SDK_DIR/tools/bin/sdkmanager" || echo "Symlink creation failed"
          
          # Accept licenses
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses 2>/dev/null || true
          yes | sdkmanager "build-tools;30.0.3" 2>/dev/null || true

      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show errors
        if: always()
        run: |
          echo "===== ERRORS ====="
          grep -E "ERROR:|Exception:|failed:|Traceback" build.log | head -20 || echo "No errors"
          echo "================="
          echo "===== LAST 30 LINES ====="
          tail -30 build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
