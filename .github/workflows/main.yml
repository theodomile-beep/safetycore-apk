name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Docker (manual SDK setup)
        run: |
          docker run --rm \
            -v "$(pwd):/app" \
            -w /app \
            --entrypoint /bin/bash \
            kivy/buildozer \
            -c "
              echo '📦 Setting up SDK manually...'
              export ANDROID_HOME=/android-sdk
              mkdir -p \$ANDROID_HOME
              
              echo '📦 Downloading command-line tools...'
              wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
              unzip -q commandlinetools-linux-9477386_latest.zip
              mv cmdline-tools \$ANDROID_HOME/latest
              export PATH=\$ANDROID_HOME/latest/bin:\$PATH
              
              echo '📦 Accepting licenses...'
              yes | sdkmanager --licenses 2>/dev/null || true
              
              echo '📦 Installing build-tools 30.0.3...'
              sdkmanager 'build-tools;30.0.3' 2>/dev/null || echo 'Build-tools installed'
              
              echo '📦 Creating symlink for Buildozer...'
              mkdir -p /root/.buildozer/android/platform
              ln -sf \$ANDROID_HOME /root/.buildozer/android/platform/android-sdk
              
              echo '🚀 Building APK...'
              buildozer android debug
            "

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
