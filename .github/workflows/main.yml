name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK using Docker (install build-tools first)
        run: |
          docker run --rm \
            -v "$(pwd):/home/user/hostcwd" \
            -w /home/user/hostcwd \
            kivy/buildozer:latest \
            bash -c "
              # Accept Android licenses
              yes | sdkmanager --licenses
              # Install build-tools (includes aidl)
              sdkmanager 'build-tools;30.0.3'
              # Now build the APK with verbose output
              buildozer -v android debug
            "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: bin/*.apk
