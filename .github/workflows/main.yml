name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip openjdk-17-jdk git zip unzip wget
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Accept Android licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build.log

      - name: Show errors
        if: always()
        run: |
          echo "===== ERRORS ====="
          grep -E "ERROR:|Exception:|failed:|Traceback" build.log | head -30 || echo "No errors found"
          echo "================="
          echo "===== LAST 50 LINES ====="
          tail -50 build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
