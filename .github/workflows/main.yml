name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Accept Android licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          yes | sdkmanager "build-tools;30.0.3" || true
          yes | sdkmanager "platform-tools" || true
          yes | sdkmanager "platforms;android-30" || true

      - name: Setup SDK symlink for Buildozer
        run: |
          mkdir -p ~/.buildozer/android/platform
          rm -rf ~/.buildozer/android/platform/android-sdk
          ln -sf /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          
          # Find and link sdkmanager
          SDKMANAGER_PATH=$(find /usr/local/lib/android/sdk -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER_PATH" ]; then
            mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
            ln -sf "$SDKMANAGER_PATH" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          fi

      - name: Install buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip openjdk-17-jdk git zip unzip wget
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Create buildozer.spec with correct SDK path
        run: |
          echo "android.sdk_path = /usr/local/lib/android/sdk" >> buildozer.spec

      - name: Build APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/build-tools/30.0.3
          buildozer android debug 2>&1 | tee build.log

      - name: Show errors
        if: always()
        run: |
          echo "===== ERRORS ====="
          grep -E "ERROR:|Exception:|failed:|Traceback" build.log | head -30 || echo "No errors found"
          echo "================="
          echo "===== LAST 50 LINES ====="
          tail -50 build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
