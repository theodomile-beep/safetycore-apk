name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python and system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip autoconf automake libtool
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Symlink SDK and fix sdkmanager path
        run: |
          mkdir -p ~/.buildozer/android/platform
          rm -rf ~/.buildozer/android/platform/android-sdk
          ln -s /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk

          SDK_DIR=/usr/local/lib/android/sdk
          SDKMANAGER_PATH=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf "$SDKMANAGER_PATH" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          fi

      - name: Build APK and save full log
        run: |
          echo "⚙️ Build started at $(date)"
          buildozer -v android debug 2>&1 | tee build.log
          echo "✅ Build finished at $(date)"

      - name: Check for APK in the log and file system
        if: always()
        run: |
          echo "=========================================="
          echo "📦 SEARCHING FOR APK REFERENCES IN LOG"
          grep -i "apk" build.log || echo "No 'apk' in log."
          echo "=========================================="
          echo "📁 LISTING BUILD OUTPUT DIRECTORIES"
          find .buildozer -type f -name "*.apk" 2>/dev/null || echo "No APK in .buildozer"
          echo "=========================================="
          echo "📁 LISTING BIN DIRECTORY"
          ls -la bin/ 2>/dev/null || echo "bin/ not found"
          echo "=========================================="
          echo "📁 SEARCHING ENTIRE WORKSPACE FOR APK"
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found anywhere."

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
