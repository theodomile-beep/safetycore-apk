name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK (install build-tools then build)
        run: |
          docker run --rm \
            -v "$(pwd):/home/user/hostcwd" \
            -w /home/user/hostcwd \
            --entrypoint /bin/bash \
            kivy/buildozer:latest \
            -c "
              set -e
              echo '📦 Installing build-tools (includes aidl)...'
              yes | sdkmanager --licenses
              sdkmanager 'build-tools;30.0.3'
              echo '🚀 Starting build...'
              buildozer -v android debug
            "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: bin/*.apk
