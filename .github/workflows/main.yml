name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest    # faster runner assignment

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jdk python3-pip git zip unzip wget
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Build APK (verbose output)
        run: |
          echo "⚙️ Build started at $(date)"
          buildozer -v android debug
          echo "✅ Build finished at $(date)"

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: SafetyCore-APK
          path: bin/*.apk
