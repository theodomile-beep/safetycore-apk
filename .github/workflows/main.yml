name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip openjdk-17-jdk git zip unzip wget
          pip install buildozer==1.5.0 cython==0.29.37

      - name: Setup Android SDK
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR"
          
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          
          mkdir -p "$SDK_DIR/cmdline-tools"
          mv cmdline-tools "$SDK_DIR/cmdline-tools/latest"
          
          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
          
          export ANDROID_HOME="$SDK_DIR"
          export PATH="$PATH:$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/tools/bin"
          
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platform-tools" 2>/dev/null || true
          sdkmanager "platforms;android-30" 2>/dev/null || true
          sdkmanager "build-tools;30.0.3" 2>/dev/null || true

      - name: Build APK
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export PATH="$PATH:$ANDROID_HOME/build-tools/30.0.3:$ANDROID_HOME/tools/bin"
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show Gradle error
        if: always()
        run: |
          echo "===== GRADLE ERROR DETAILS ====="
          grep -A 50 -B 10 "gradlew failed" build.log || echo "No gradlew error"
          echo "================================="
          echo "===== JAVA/GRADLE ERRORS ====="
          grep -E "FAILED|error:|Error:|Exception|Could not" build.log | head -30
          echo "================================="
          echo "===== LAST 100 LINES ====="
          tail -100 build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
