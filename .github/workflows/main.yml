name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Docker (fix sdkmanager path)
        run: |
          docker run --rm \
            -v "$(pwd):/app" \
            -w /app \
            --entrypoint /bin/bash \
            kivy/buildozer \
            -c "
              echo '📦 Finding sdkmanager...'
              SDKMANAGER=\$(find / -name sdkmanager -type f 2>/dev/null | head -1)
              echo \"Found sdkmanager at: \$SDKMANAGER\"
              
              echo '📦 Installing build-tools...'
              yes | \$SDKMANAGER --licenses
              \$SDKMANAGER 'build-tools;30.0.3'
              
              echo '🚀 Building APK...'
              buildozer android debug
            "

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
